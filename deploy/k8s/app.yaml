apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: festival-data
  namespace: festival
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: festival-api
  namespace: festival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: festival-api
  template:
    metadata:
      labels:
        app: festival-api
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_OCIR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DATABASE_PATH
              value: /data/festival.sqlite
            - name: APP_ORIGIN
              value: https://festival.example.com
            - name: TEMPORAL_GATEWAY_URL
              value: http://temporal-worker:8081
            - name: TEMPORAL_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: festival-temporal
                  key: gateway-token
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: festival-data
---
apiVersion: v1
kind: Service
metadata:
  name: festival-api
  namespace: festival
spec:
  selector:
    app: festival-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: festival
  namespace: festival
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - festival.example.com
      secretName: festival-tls
  rules:
    - host: festival.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: festival-api
                port:
                  name: http
