name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce branch promotion flow
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          case "$PR_BASE" in
            dev)
              if [[ "$PR_HEAD" == "qa" || "$PR_HEAD" == "main" ]]; then
                echo "Only work branches may target dev; qa and main cannot be merged back into dev."
                exit 1
              fi
              ;;
            qa)
              if [[ "$PR_HEAD" != "dev" ]]; then
                echo "Only dev may target qa; received: $PR_HEAD."
                exit 1
              fi
              ;;
            main)
              if [[ "$PR_HEAD" != "qa" ]]; then
                echo "Only qa may target main; received: $PR_HEAD."
                exit 1
              fi
              ;;
            *)
              echo "Pull requests may target only dev, qa, or main; received: $PR_BASE."
              exit 1
              ;;
          esac
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check and build
        run: bun run check && bun run build
      - name: Build API container
        run: docker build -t festival-api:${{ github.sha }} -f deploy/Dockerfile .
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: festival-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build Temporal worker container
        run: docker build -t festival-temporal-worker:${{ github.sha }} -f deploy/temporal-worker.Dockerfile .
      - name: Scan Temporal worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: festival-temporal-worker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
