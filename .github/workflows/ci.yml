name: CI

on:
  pull_request:
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch promotion flow
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: |
          case "$PR_BASE" in
            dev)
              if [[ "$PR_HEAD" != feat/* ]]; then
                echo "Only feat/* branches may target dev; received: $PR_HEAD."
                exit 1
              fi
              ;;
            qa)
              if [[ "$PR_HEAD" != "dev" || "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
                echo "Only the dev branch in $PR_BASE_REPO may target qa; received $PR_HEAD from $PR_HEAD_REPO."
                exit 1
              fi
              ;;
            main)
              if [[ "$PR_HEAD" != "qa" || "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
                echo "Only the qa branch in $PR_BASE_REPO may target main; received $PR_HEAD from $PR_HEAD_REPO."
                exit 1
              fi
              ;;
            *)
              echo "Pull requests may target only dev, qa, or main; received: $PR_BASE."
              exit 1
              ;;
          esac
  verify:
    needs: branch-flow
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require branch-flow to pass
        if: needs.branch-flow.result != 'success'
        run: |
          echo "The branch-flow check failed."
          exit 1
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Codex workflow entry points
        run: |
          bash -n scripts/codex/setup.sh scripts/codex/verify.sh
          python3 scripts/codex/goal.py 1 > /dev/null
      - name: Verify application
        run: bash scripts/codex/verify.sh
      - name: Preserve verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .codex-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Build API container
        run: docker build -t festival-api:${{ github.sha }} -f deploy/Dockerfile .
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: festival-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build Temporal worker container
        run: docker build -t festival-temporal-worker:${{ github.sha }} -f deploy/temporal-worker.Dockerfile .
      - name: Scan Temporal worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: festival-temporal-worker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
