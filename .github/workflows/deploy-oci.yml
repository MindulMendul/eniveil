name: Deploy to OCI with Docker Compose

on:
  push:
    branches: [qa, main]
  pull_request:
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murder-parker-compose
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate application and deployment
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bun test
          python3 -m unittest discover -s deploy/tests -v

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact commit to the existing Compose project
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '129.154.220.233' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_SHA: ${{ github.sha }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'SSH_PRIVATE_KEY secret is required (OpenSSH key or base64 encoded key)'; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          key="$RUNNER_TEMP/mindul_web_key"
          trap 'rm -f "$key"' EXIT
          if [[ "$SSH_PRIVATE_KEY" == *'BEGIN OPENSSH PRIVATE KEY'* || "$SSH_PRIVATE_KEY" == *'BEGIN RSA PRIVATE KEY'* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          printf -v remote_command 'PUBLIC_GA_MEASUREMENT_ID=%q python3 - %q %q' "$PUBLIC_GA_MEASUREMENT_ID" "$DEPLOY_ENVIRONMENT" "$DEPLOY_SHA"
          ssh -i "$key" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$PWD/deploy/ssh_known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" "$remote_command" < deploy/deploy-compose.py
