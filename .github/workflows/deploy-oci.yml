name: Deploy to OCI with Docker Compose

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 129.154.220.233
      DEPLOY_USER: ubuntu
      DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/home/ubuntu/murder-parker' }}
      APP_ORIGIN: https://mindul-murder-mystery.duckdns.org
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify SSH host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest main with Docker Compose
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "OCI_DEPLOY_PATH must be an absolute path"; exit 1 ;;
          esac
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "OCI_DEPLOY_PATH contains unsupported characters"
            exit 1
          fi

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH' '$EXPECTED_SHA'" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          expected_sha="$2"
          repo_url="https://github.com/MindulMendul/murder-parker.git"

          if [ ! -d "$deploy_path/.git" ]; then
            if [ -e "$deploy_path" ]; then
              echo "Deploy path exists but is not a Git checkout: $deploy_path" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$deploy_path")"
            git clone --branch main --single-branch "$repo_url" "$deploy_path"
          fi

          if [ -n "$(git -C "$deploy_path" status --porcelain)" ]; then
            echo "Server checkout has local changes; refusing to overwrite them." >&2
            exit 1
          fi

          git -C "$deploy_path" remote set-url origin "$repo_url"
          git -C "$deploy_path" fetch --prune origin main
          if git -C "$deploy_path" show-ref --verify --quiet refs/heads/main; then
            git -C "$deploy_path" switch main
          else
            git -C "$deploy_path" switch --track -c main origin/main
          fi
          git -C "$deploy_path" merge --ff-only origin/main

          deployed_sha="$(git -C "$deploy_path" rev-parse HEAD)"
          if [ "$deployed_sha" != "$expected_sha" ]; then
            echo "Expected $expected_sha but checked out $deployed_sha; refusing stale deployment." >&2
            exit 1
          fi

          cd "$deploy_path"
          APP_ORIGIN="https://mindul-murder-mystery.duckdns.org" docker compose -f deploy/compose.yaml up -d --build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Application health check passed."
              exit 0
            fi
            sleep 2
          done

          docker compose -f deploy/compose.yaml logs --tail=100 festival
          echo "Application did not become healthy." >&2
          exit 1
          REMOTE
